version: '3.9'
services:
  dev-agent:
    build: .
    working_dir: /work
    volumes:
      - .:/work
    environment:
      - PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
      # 自动提交启用（仍不推送）
      - DEV_AGENT_AUTOCOMMIT=1
      - DEV_AGENT_COMMIT_INTERVAL=180
      # 每日里程碑自动 tag（仅本地，不推送）
      - DEV_AGENT_AUTOTAG=1
      # 如需自动推送，请显式开启：
      # - DEV_AGENT_AUTOPUSH=1
    command: >
      bash -lc "
        python -m pip install --upgrade pip && \
        pip install -e . && pip install -U pytest pytest-cov ruff black isort mypy bandit && \
        python -m mcp_rules_assistant.dev_agent --serve 0.0.0.0:${DEV_AGENT_PORT:-9000} --interval 60
      "
    ports:
      - "${DEV_AGENT_PORT:-9000}:${DEV_AGENT_PORT:-9000}"
