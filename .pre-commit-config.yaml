repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
        args: ["--fix"]
        stages: [pre-commit]
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        stages: [pre-commit]
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        stages: [pre-commit]
        files: mcp_rules_assistant/
        additional_dependencies: [types-PyYAML]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        stages: [pre-push]
  - repo: local
    hooks:
      - id: plan-gate
        name: plan state & commit message gate (commit-msg)
        entry: python3 .mcp/plan_gate.py commit-msg
        language: system
        stages: [commit-msg]
      - id: tdd-gate
        name: tdd gate (commit)
        entry: python3 .mcp/tdd_gate.py
        language: system
        stages: [pre-commit]
      - id: branch-name-gate
        name: branch naming gate (commit)
        entry: python3 .mcp/branch_name_gate.py
        language: system
        stages: [pre-commit]
      - id: dockerfile-baseline
        name: dockerfile baseline (push)
        entry: python3 .mcp/dockerfile_gate.py
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest-with-coverage
        name: pytest with coverage (push)
        entry: sh -c 'pytest -q --maxfail=1 --disable-warnings -W error --strict-markers --cov --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=96'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: no-skip-xfail
        name: forbid skip/xfail (push)
        entry: sh -c 'if git grep -nE "pytest\\.mark\\.(skip|xfail)" -- ":(exclude)tests/*" mcp_rules_assistant >/dev/null; then echo "Found skip/xfail markers in package code. Disallowed."; exit 1; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: docs-anchors
        name: docs anchors snapshot (push)
        entry: sh -c 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q tests/docs/test_docs_anchors.py'
        language: system
        pass_filenames: false
        stages: [pre-push]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ["-q", "-ll", "-x", "tests"]
        stages: [pre-push]
