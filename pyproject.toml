[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-rules-assistant"
version = "0.2.5"
description = "MCP rules & context assistant (Python server + VS Code extension)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Your Team"}]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["mcp", "rules", "coverage", "cli", "vscode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
]
urls = {"Homepage" = "https://github.com/efem1978/Contextual-Cohesion-and-Programming-Rules-Assistant-MCP-Tool", "Repository" = "https://github.com/efem1978/Contextual-Cohesion-and-Programming-Rules-Assistant-MCP-Tool.git"}
dependencies = [
  "typer>=0.9",
  "PyYAML>=6.0",
  "rich>=13.7",
  "defusedxml>=0.7.1"
]

[project.scripts]
mcp-rules-assistant = "mcp_rules_assistant.cli:app"
 
[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_rules_assistant*"]

[tool.setuptools.package-data]
mcp_rules_assistant = ["py.typed"]

[tool.coverage.run]
source = ["mcp_rules_assistant"]
omit = ["**/.mcp/*.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
extend-exclude = ["tests"]

[tool.ruff.lint]
# Ignore multiple-statements-per-line (E702) globally; project uses short, semicolon-separated statements
ignore = ["E702"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["mcp_rules_assistant"]
