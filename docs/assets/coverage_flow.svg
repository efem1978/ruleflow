<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#0f172a"/>
  <text x="40" y="60" font-size="28" font-family="-apple-system,Segoe UI,Arial" fill="#e5e7eb">覆盖率工作流（占位图）</text>
  <rect x="60" y="100" width="180" height="60" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="80" y="135" font-size="16" fill="#9ca3af">pytest + cov</text>
  <rect x="300" y="100" width="220" height="60" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="320" y="135" font-size="16" fill="#9ca3af">coverage.xml → summarize</text>
  <rect x="580" y="100" width="300" height="60" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="600" y="135" font-size="16" fill="#9ca3af">policy：basename > prefix > min_module</text>
  <line x1="240" y1="130" x2="300" y2="130" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/>
  <line x1="520" y1="130" x2="580" y2="130" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="60" y="220" width="860" height="220" rx="8" fill="#111827" stroke="#374151"/>
  <text x="80" y="250" font-size="16" fill="#9ca3af">输出：</text>
  <text x="120" y="280" font-size="14" fill="#d1d5db">- 弱项（weak，Top 50，Δ 降序）</text>
  <text x="120" y="305" font-size="14" fill="#d1d5db">- 分组（groups，按阈值聚合）</text>
  <text x="120" y="330" font-size="14" fill="#d1d5db">- 近阈值（near，≤窗口，Top N）</text>
  <text x="120" y="355" font-size="14" fill="#d1d5db">- 汇总 report（weak/groups/near）</text>
  <text x="120" y="380" font-size="14" fill="#6b7280">注：覆盖率薄弱项清零（weak==0）作为门禁；near 用于指引优先提升。</text>
</svg>
