name: Nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-ci.txt ruff black isort mypy bandit pytest pytest-cov types-PyYAML
      - name: Docs Snapshot Gate
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q tests/docs/test_docs_anchors.py
      - name: Tests + Coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -q -p pytest_cov --maxfail=1 --disable-warnings -W error --strict-markers \
            --cov=mcp_rules_assistant --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=pytest-junit.xml
      - name: Coverage Export (CSV/JSON)
        run: |
          python -m pip install -e .
          python -m mcp_rules_assistant.cli coverage-export --out-dir .mcp/dashboard --weak-top 50 --near-top 50 --within 3 || true
      - name: JB Verify Summary (optional)
        run: |
          bash scripts/jb-ui-verify.sh || true
          if [ -f .mcp/dashboard/jb_verify.json ]; then echo "[jb] summary"; head -n 80 .mcp/dashboard/jb_verify.json; fi
      - name: JB Groups Top (from jb_verify.json)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.mcp/dashboard/jb_verify.json')
          if not p.exists():
              print('[jb] jb_verify.json missing')
          else:
              D=json.loads(p.read_text(encoding='utf-8'))
              top=D.get('coverage',{}).get('groups_top') or []
              if not top:
                  print('[jb] groups_top empty')
              else:
                  print('| prefix | coverage | threshold | weak/files |')
                  print('|---|---:|---:|---:|')
                  for g in top:
                      print(f"| {g.get('prefix','')} | {g.get('coverage',0):.1f}% | {g.get('threshold',0)}% | {g.get('weak',0)}/{g.get('files',0)} |")
          PY
      - name: Coverage Groups Table (Top 5)
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('.mcp/dashboard/groups.csv')
          if not p.exists():
              print('[groups] missing .mcp/dashboard/groups.csv')
          else:
              rows=list(csv.DictReader(p.open('r',encoding='utf-8')))
              rows.sort(key=lambda r: int(r.get('weak_count',0)), reverse=True)
              print('[groups] Top 5 by weak_count:')
              print('| prefix | coverage | threshold | weak/files |')
              print('|---|---:|---:|---:|')
              for r in rows[:5]:
                  cov=float(r.get('coverage',0))*100
                  thr=int(float(r.get('threshold',0))*100)
                  print(f"| {r.get('prefix','')} | {cov:.1f}% | {thr}% | {r.get('weak_count','0')}/{r.get('files_count','0')} |")
          PY
      - name: Upload Coverage Export artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-coverage-export
          path: |
            .mcp/dashboard/coverage_summary.json
            .mcp/dashboard/weak_top.csv
            .mcp/dashboard/near_top.csv
            .mcp/dashboard/groups.csv
            .mcp/dashboard/jb_verify.json
            .mcp/dashboard/jb_groups.md
          if-no-files-found: ignore
      - name: Upload JB Verify artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jb-verify
          path: .mcp/dashboard/jb_verify.json
          if-no-files-found: ignore
      - name: Preflight
        run: |
          sh scripts/preflight.sh
      - name: Upload coverage & JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-python
          path: |
            coverage.xml
            pytest-junit.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'extensions/vscode/package-lock.json'
      - name: Install and compile (VS Code)
        working-directory: extensions/vscode
        run: |
          npm ci || npm install
          npm run compile
      - name: VS Code extension tests
        working-directory: extensions/vscode
        run: |
          MCP_VSCODE_TEST_ARGS="" xvfb-run -a npm test 2>&1 | tee vscode-test.log
      - name: VS Code coverage threshold (warn)
        run: |
          sh scripts/check-lcov.sh extensions/vscode/coverage/lcov.info 30
      - name: Upload VS Code artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-vscode
          path: |
            extensions/vscode/coverage/lcov.info
            extensions/vscode/vscode-test.log
