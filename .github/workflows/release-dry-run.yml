name: Release Dry Run

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install package and test tools (best-effort)
        run: |
          python -m pip install --upgrade pip
          pip install -e . || true
          pip install pytest pytest-cov || true
      - name: Generate coverage (best-effort)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          pytest -q -p pytest_cov --maxfail=1 --disable-warnings -W error --strict-markers \
            --cov=mcp_rules_assistant --cov-report=xml:coverage.xml --cov-report=term-missing || true
      - name: Coverage export (CSV/JSON, best-effort)
        run: |
          python -m mcp_rules_assistant.cli coverage-export --out-dir .mcp/dashboard --weak-top 50 --near-top 50 --within 3 || true
      - name: JB verify summary (best-effort)
        run: |
          bash scripts/jb-ui-verify.sh || true
      - name: Generate release note snippet (best-effort)
        run: |
          python3 scripts/release-note-from-report.py || true
      - name: Generate changes from git (best-effort)
        run: |
          python3 scripts/release-changes-from-git.py || true
      - name: Security SBOM + audit bundle (best-effort)
        run: |
          python3 scripts/sbom_generate.py || true
          bash scripts/ci-security.sh || true
          mkdir -p .mcp/dashboard
          (cd dist && sha256sum * > ../.mcp/dashboard/dist.sha256 || shasum -a 256 * > ../.mcp/dashboard/dist.sha256) 2>/dev/null || true
          if ls extensions/vscode/*.vsix >/dev/null 2>&1; then (cd extensions/vscode && sha256sum *.vsix > ../../.mcp/dashboard/vsix.sha256 || shasum -a 256 *.vsix > ../../.mcp/dashboard/vsix.sha256); fi
      - name: Upload Dry Run Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dry-run
          path: |
            coverage.xml
            .mcp/dashboard/sbom.json
            .mcp/dashboard/security_audit.jsonl
            .mcp/dashboard/dist.sha256
            .mcp/dashboard/vsix.sha256
            .mcp/dashboard/coverage_summary.json
            .mcp/dashboard/weak_top.csv
            .mcp/dashboard/near_top.csv
            .mcp/dashboard/groups.csv
            .mcp/dashboard/jb_verify.json
            .mcp/dashboard/jb_groups.md
            .mcp/dashboard/release_note_snippet.md
            .mcp/dashboard/release_changes.md
