name: Admin - Merge PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to merge'
        required: true
      method:
        description: 'Merge method: squash | merge | rebase'
        default: 'squash'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve review conversations and merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = Number('${{ inputs.pr_number }}');
            let methodRaw = '${{ inputs.method }}';
            const method = (methodRaw && methodRaw.trim()) ? methodRaw.toLowerCase() : 'squash';
            const ALLOW = new Set(['squash','merge','rebase']);
            if (!Number.isFinite(prNumber)) { core.setFailed('Invalid pr_number'); return; }
            if (!ALLOW.has(method)) { core.setFailed(`Invalid merge method: ${method}`); return; }

            const [owner, repo] = (process.env.GITHUB_REPOSITORY || '').split('/');
            if (!owner || !repo) { core.setFailed('Cannot parse GITHUB_REPOSITORY'); return; }

            // 1) Query all review threads and resolve unresolved ones (no isResolved arg on connection)
            const query = `query($owner:String!, $name:String!, $number:Int!, $first:Int!){
              repository(owner:$owner, name:$name){
                pullRequest(number:$number){
                  reviewThreads(first:$first){
                    nodes { id isResolved }
                  }
                }
              }
            }`;
            let unresolvedIds = [];
            try {
              const r = await github.graphql(query, { owner, name: repo, number: prNumber, first: 100 });
              unresolvedIds = (r?.repository?.pullRequest?.reviewThreads?.nodes ?? [])
                .filter(t => !t.isResolved).map(t => t.id);
            } catch (e) {
              core.warning('Query threads failed: ' + String(e));
            }
            let resolved = 0;
            for (const id of unresolvedIds) {
              try {
                await github.graphql(
                  `mutation($id:ID!){
                    resolveReviewThread(input:{threadId:$id}){ thread{ isResolved } }
                  }`,
                  { id }
                );
                resolved++;
              } catch (e) {
                core.warning('Resolve failed for thread ' + id + ': ' + String(e));
              }
            }

            // 2) Ensure combined status on PR head is success
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            const headSha = pr.head.sha;
            const combined = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: headSha });
            const state = combined.data.state; // success | failure | pending

            await core.summary
              .addHeading('Admin Merge PR')
              .addRaw(`Resolved threads: ${resolved}\n`)
              .addRaw(`Combined status: ${state}\n`)
              .write();

            if (state !== 'success') {
              core.setFailed('Checks are not successful. Please re-run CI or update branch.');
              return;
            }

            // 3) Merge PR
            try {
              const res = await github.rest.pulls.merge({
                owner, repo, pull_number: prNumber, merge_method: method
              });
              await core.summary.addRaw(`Merged: ${res.data.merged} (${res.data.message})\n`).write();
              console.log(res.data);
            } catch (e) {
              core.setFailed('Merge failed: ' + String(e));
            }
