name: Admin - Merge PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to merge'
        required: true
      method:
        description: 'Merge method: squash | merge | rebase'
        default: 'squash'
        required: false

# 可选：如需让默认 GITHUB_TOKEN 也能写入，可开启下方权限
permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve review conversations and merge
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        with:
          github-token: ${{ secrets.GH_ADMIN_TOKEN }}
          script: |
            const prNumber = parseInt(core.getInput('pr_number'));
            if (Number.isNaN(prNumber)) {
              core.setFailed('Invalid pr_number'); return;
            }
            const method = (core.getInput('method') || 'squash').toLowerCase();
            const ALLOW = new Set(['squash','merge','rebase']);
            if (!ALLOW.has(method)) {
              core.setFailed(`Invalid merge method: ${method}`); return;
            }
            if (!process.env.GH_TOKEN) {
              core.setFailed('Missing secret: GH_ADMIN_TOKEN'); return;
            }

            const [owner, repo] = (process.env.GITHUB_REPOSITORY || '').split('/');
            if (!owner || !repo) {
              core.setFailed('Cannot parse GITHUB_REPOSITORY'); return;
            }

            // 1) Resolve all unresolved review threads (GraphQL)
            const q = `query($owner:String!, $name:String!, $number:Int!){
              repository(owner:$owner, name:$name){
                pullRequest(number:$number){
                  reviewThreads(first:100, isResolved:false){ nodes{ id isResolved } }
                }
              }
            }`;
            let unresolved = [];
            try {
              const res = await github.graphql(q, { owner, name: repo, number: prNumber });
              unresolved = (((res || {}).repository || {}).pullRequest || {}).reviewThreads?.nodes || [];
              unresolved = unresolved.filter(n => !n.isResolved).map(n => n.id);
            } catch (e) {
              core.warning('Failed to query review threads: ' + String(e));
            }

            let resolvedCount = 0;
            for (const id of unresolved) {
              try {
                await github.graphql(
                  `mutation($id:ID!){
                    resolveReviewThread(input:{threadId:$id}){ thread{ isResolved } }
                  }`,
                  { id }
                );
                resolvedCount++;
              } catch (e) {
                core.warning('Resolve failed for thread ' + id + ': ' + String(e));
              }
            }

            // 2) Ensure checks are successful on the PR head
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            const headSha = pr.head.sha;
            const combined = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: headSha });
            const state = combined.data.state; // success | failure | pending

            await core.summary
              .addHeading('Admin Merge PR')
              .addRaw(`Resolved threads: ${resolvedCount}\n`)
              .addRaw(`Combined status: ${state}\n`)
              .write();

            if (state !== 'success') {
              core.setFailed('Checks are not successful. Please re-run CI or update branch.');
              return;
            }

            // 3) Attempt to merge
            try {
              const res = await github.rest.pulls.merge({
                owner, repo, pull_number: prNumber, merge_method: method
              });
              await core.summary.addRaw(`Merged: ${res.data.merged} (${res.data.message})\n`).write();
              console.log(res.data);
            } catch (e) {
              core.setFailed('Merge failed: ' + String(e));
            }
