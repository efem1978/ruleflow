name: Pre-Release

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  pre-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps (editable)
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -e .
          python3 -m pip install -U pytest pytest-cov ruff black isort mypy bandit pre-commit types-PyYAML build twine

      - name: VS Code deps (ci)
        run: |
          npm --prefix extensions/vscode ci
          npm --prefix extensions/vscode run compile || true

      - name: Release simulate (best-effort VS Code tests)
        env:
          MCP_VSCODE_TEST_ARGS: ''
        run: |
          bash scripts/release-simulate.sh || true

      - name: Compose release body
        run: |
          bash scripts/release-compose-body.sh

      - name: Pre-release checklist
        env:
          LCOV_THRESHOLD: '80'
          WITH_DOCKER_VERIFY: '0'
        run: |
          bash scripts/pre-release-check.sh

      - name: Upload dashboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-dashboard
          path: .mcp/dashboard/**

