name: Pre-Release

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  pre-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install Python deps (editable)
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -c constraints-ci.txt -e .
          python3 -m pip install -U -c constraints-ci.txt pytest pytest-cov ruff black isort mypy bandit pre-commit types-PyYAML build twine cryptography

      - name: VS Code deps (ci)
        run: |
          npm --prefix extensions/vscode ci
          npm --prefix extensions/vscode run compile || true

      - name: Release simulate (best-effort VS Code tests)
        env:
          MCP_VSCODE_TEST_ARGS: ''
        run: |
          bash scripts/release-simulate.sh || true

      - name: Compose release body
        shell: bash
        run: bash scripts/release-compose-body.sh

      - name: Pre-release checklist
        env:
          LCOV_THRESHOLD: '80'
          WITH_DOCKER_VERIFY: '0'
        run: |
          bash scripts/pre-release-check.sh
      - name: Security SBOM + audit bundle (best-effort)
        run: |
          python3 scripts/sbom_generate.py || true
          bash scripts/ci-security.sh || true
          mkdir -p .mcp/dashboard
          (cd dist && sha256sum * > ../.mcp/dashboard/dist.sha256 || shasum -a 256 * > ../.mcp/dashboard/dist.sha256) 2>/dev/null || true
          if ls extensions/vscode/*.vsix >/dev/null 2>&1; then (cd extensions/vscode && sha256sum *.vsix > ../../.mcp/dashboard/vsix.sha256 || shasum -a 256 *.vsix > ../../.mcp/dashboard/vsix.sha256); fi

      - name: Upload dashboard artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-release-dashboard
          path: .mcp/dashboard/**
