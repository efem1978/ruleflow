name: PR Checklist Guard
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR checklist
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const body = context.payload.pull_request?.body || '';
            const required = [
              '- [x] Tests added/updated to cover changes',
              '- [x] `make local-ci-run` passes locally (lint/type/tests/coverage gate)',
              '- [x] No skip/xfail introduced (policy forbids in push/CI)',
              '- [x] `.mcp/plan.md` is `in_progress` and commit message contains `[step:<current-step>]`',
              '- [x] CI workflow unchanged or updated accordingly',
            ];
            const ok = required.every(line => body.toLowerCase().includes(line.toLowerCase()));
            if (!ok) {
              core.setFailed('PR checklist is not fully checked. Please tick all required items.');
            }

