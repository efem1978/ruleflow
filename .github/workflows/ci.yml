name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-ci.txt ruff black isort mypy bandit pytest pytest-cov types-PyYAML pytest-benchmark psutil
          # Install project deps for mypy import resolution (typer, rich, pyyaml, etc.)
          pip install -c constraints-ci.txt -e .
      - name: Pre-commit (all files)
        run: |
          python -m pip install -c constraints-ci.txt pre-commit
          pre-commit run --all-files || true
      - name: Check Dockerfile existence
        run: |
          test -f Dockerfile || (echo 'Dockerfile missing' && exit 1)
      - name: Dockerfile Lint (hadolint)
        run: |
          test -f Dockerfile && docker run --rm -v "$PWD":/work -w /work hadolint/hadolint:2.12.0 hadolint  Dockerfile || echo 'skip hadolint'
      - name: Lint (ruff/black/isort)
        run: |
          ruff check --output-format=github mcp_rules_assistant
          black --check mcp_rules_assistant
          isort --check-only mcp_rules_assistant
      - name: Docs Snapshot Gate (preflight subset)
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q tests/docs/test_docs_anchors.py
      - name: Preflight
        run: |
          sh scripts/preflight.sh
      - name: Type Check (core, blocking)
        run: |
          mypy             mcp_rules_assistant/config.py             mcp_rules_assistant/progress.py             mcp_rules_assistant/tools.py             mcp_rules_assistant/memory.py             mcp_rules_assistant/mcp_server.py             mcp_rules_assistant/cli.py             mcp_rules_assistant/server.py
      - name: Type Check (rest, non-blocking)
        run: |
          mypy mcp_rules_assistant || true
      - name: Tests + Coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -q -p pytest_cov -p benchmark --maxfail=1 --disable-warnings -W error --strict-markers --cov=mcp_rules_assistant --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=pytest-junit.xml
      - name: Coverage Policy Gate (core≥98%, others≥95%)
        if: github.ref == 'refs/heads/main'
        run: |
          python -m mcp_rules_assistant.cli coverage-report --json > cov.json
          python - <<'PY'
          import json
          import sys
          data = json.load(open('cov.json'))
          weak = data.get('weak') or []
          if weak:
            print('[mcp] Coverage policy gate failed. Weak files:')
            for w in weak:
              print(' -', w.get('file'), 'cov=', w.get('coverage'), '<', w.get('threshold'))
            sys.exit(1)
          print('[mcp] Coverage policy gate passed.')
          PY
      - name: Coverage Near Summary
        run: |
          python -m mcp_rules_assistant.cli coverage-near --within 3 --top 10 > near.txt || true
          python -m mcp_rules_assistant.cli coverage-near --within 3 --top 10 --format csv --output near.csv || true
          python -m mcp_rules_assistant.cli coverage-near --within 3 --top 10 --format json --output near.json || true
          tar czf tests-artifacts.tar.gz coverage.xml pytest-junit.xml near.txt near.csv near.json || true
      - name: Upload coverage & JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest-junit.xml
            near.txt
            near.csv
            near.json
            tests-artifacts.tar.gz
      - name: Upload Python coverage to Codecov (build)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false
      - name: Security (bandit — high only)
        run: |
          bandit -q -lll -x tests -r .
      - name: SAST (semgrep)
        run: |
          # 固定 semgrep 版本以提升可重复性
          python -m pip install 'semgrep==1.91.0'
          # 仅扫描产品代码目录，减少测试/扩展示例的噪声，保持阻断
          semgrep --error --config p/ci mcp_rules_assistant
      - name: Mutation testing
        run: |
          python -m pip install mutmut
          if grep -Eq '(^|[^#])\bmode:\s*strict\b' .mcp/assistant.yaml || grep -Eq '(^|[^#])\bmutation_gate_strict:\s*true\b' .mcp/assistant.yaml; then
            mutmut run -q
          else
            mutmut run -q || true
          fi
      - name: Build & Verify (sdist/wheel)
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit || true
      - name: License whitelist gate (pip-licenses)
        run: |
          python -m pip install pip-licenses
          # Export licenses to file for auditing
          pip-licenses --format=json --output-file licenses.json || true
          python - <<'PY'
          import json, subprocess, sys
          # Collect licenses (from file if exists, else fresh call)
          try:
              data = json.load(open('licenses.json', 'r', encoding='utf-8'))
          except Exception:
              import subprocess
              out = subprocess.check_output(['pip-licenses', '--format=json'], text=True)
              data = json.loads(out)
          # Allowed licenses (OSI-friendly + common)
          allowed = {
              'MIT', 'BSD', 'BSD License', 'BSD-2-Clause', 'BSD-3-Clause',
              'Apache 2.0', 'Apache-2.0', 'Apache Software License',
              'ISC', 'MPL-2.0', 'Mozilla Public License 2.0 (MPL 2.0)',
              'Python Software Foundation License', 'PSF',
              # Allow LGPL for dev tools like semgrep
              'LGPL', 'LGPL-2.1', 'LGPL-2.1-only', 'LGPL-2.1-or-later', 'LGPLv2.1+', 'LGPL-3.0', 'LGPL-3.0-only', 'LGPL-3.0-or-later'
          }
          soft_allowed = {'UNKNOWN'}  # warn only
          violations = []
          warnings = []
          for pkg in data:
              name = pkg.get('Name') or pkg.get('name')
              ver = pkg.get('Version') or pkg.get('version')
              lic = (pkg.get('License') or pkg.get('license') or '').strip()
              tokens = [t.strip() for t in lic.replace(' OR ', ',').split(',') if t.strip()] or ['UNKNOWN']
              if any(t in allowed for t in tokens):
                  continue
              if any(t in soft_allowed for t in tokens):
                  warnings.append((name, ver, lic))
                  continue
              violations.append((name, ver, lic))
          if warnings:
              print('[license] Soft-allowed (UNKNOWN) licenses:')
              for n, v, l in warnings:
                  print(f' ~ {n} {v}: {l}')
          if violations:
              print('[license] Disallowed or unknown licenses:')
              for n, v, l in violations:
                  print(f' - {n} {v}: {l}')
              sys.exit(1)
          print('[license] All packages comply with whitelist')
          PY
      - name: Upload Licenses Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licenses-report
          path: licenses.json
      - name: Generate SBOM (CycloneDX via pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit -f cyclonedx -o sbom-cyclonedx.json || true
      - name: Upload SBOM (CycloneDX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Prepare env (mcp_rules_assistant env.prepare)
        run: |
          python - <<'PY'
          from mcp_rules_assistant.mcp_server import JsonRpcServer
          srv = JsonRpcServer()
          out = srv._call_tool("env.prepare", {"create": True, "install": True})
          print(out)
          PY
      - name: Ensure pytest tools in env
        run: |
          . ./.mcp/venv/bin/activate
          pip install -q pytest-benchmark pytest-cov coverage psutil
          # Ensure package and deps are available in venv for tests
          pip install -q -e .
      - name: Tests in env (pytest + coverage)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          . ./.mcp/venv/bin/activate
          pytest -q -p pytest_cov -p benchmark --maxfail=1 --disable-warnings -W error --strict-markers --cov=mcp_rules_assistant --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=pytest-junit.xml
      - name: Upload artifacts (env tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-prepare
          path: |
            coverage.xml
            pytest-junit.xml
      - name: Upload Python coverage to Codecov (prepare)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-prepare
          fail_ci_if_error: false
  vscode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'extensions/vscode/package-lock.json'
      - name: Install and compile
        working-directory: extensions/vscode
        run: |
          npm ci || npm install
          npm run compile
      - name: VS Code extension tests
        working-directory: extensions/vscode
        run: |
          MCP_VSCODE_TEST_ARGS="" xvfb-run -a npm test 2>&1 | tee vscode-test.log
      - name: IDE Compatibility Summary (best-effort)
        run: |
          sh scripts/ide-compat-check.sh || true
          if [ -f extensions/compat_report.json ]; then echo "[ide-compat] found"; else echo "[ide-compat] missing (ok)"; fi
      - name: VS Code coverage threshold (gate)
        run: |
          sh scripts/check-lcov.sh extensions/vscode/coverage/lcov.info 95 gate
      - name: Upload VS Code coverage to Codecov (conditional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: extensions/vscode/coverage/lcov.info
          flags: vscode
          fail_ci_if_error: false
      - name: Upload IDE compat report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ide-compat
          path: extensions/compat_report.json
      - name: Upload VS Code test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-tests
          path: extensions/vscode/vscode-test.log

