name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COVERAGE_WARN_FILTER: '1'
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install cryptography
          pip install -c constraints-ci.txt ruff black isort mypy bandit pytest pytest-cov types-PyYAML
      - name: Pre-commit (all files)
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files || true
      - name: Check Dockerfile existence
        run: |
          test -f Dockerfile || (echo 'Dockerfile missing' && exit 1)
      - name: Dockerfile Lint (hadolint)
        run: |
          test -f Dockerfile && docker run --rm -v "$PWD":/work -w /work hadolint/hadolint:2.12.0 hadolint  Dockerfile || echo 'skip hadolint'
      - name: Lint (ruff/black/isort)
        run: |
          ruff check --output-format=github mcp_rules_assistant
          black --check mcp_rules_assistant
          isort --check-only mcp_rules_assistant
      - name: Docs Snapshot Gate (preflight subset)
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q tests/docs/test_docs_anchors.py
      - name: Preflight
        run: |
          sh scripts/preflight.sh
      - name: Type Check (core, blocking)
        run: |
          mypy             mcp_rules_assistant/config.py             mcp_rules_assistant/progress.py             mcp_rules_assistant/tools.py             mcp_rules_assistant/memory.py             mcp_rules_assistant/mcp_server.py             mcp_rules_assistant/cli.py             mcp_rules_assistant/server.py
      - name: Type Check (rest, non-blocking)
        run: |
          mypy mcp_rules_assistant || true
      - name: Tests + Coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          if [ -f scripts/coverage-warn-filter.sh ]; then
            pytest -q -p pytest_cov --maxfail=1 --disable-warnings -W error --strict-markers --cov=mcp_rules_assistant --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=96 --junitxml=pytest-junit.xml 2> >(bash scripts/coverage-warn-filter.sh 1>&2)
          else
            pytest -q -p pytest_cov --maxfail=1 --disable-warnings -W error --strict-markers --cov=mcp_rules_assistant --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=96 --junitxml=pytest-junit.xml
          fi
      - name: Coverage Policy Gate (core≥98%, others≥95%)
        run: |
          python -m mcp_rules_assistant.cli coverage-report --json > cov.json
          python - <<'PY'
          import json, sys, subprocess
          data = json.load(open('cov.json'))
          weak = data.get('weak') or []
          if weak:
              print('[mcp] Coverage policy gate failed. Weak files:')
              for w in weak:
                  print(' -', w.get('file'), 'cov=', w.get('coverage'), '<', w.get('threshold'))
              # Also print near-threshold files (within 3%, top 10) before failing
              try:
                  subprocess.run(
                      [
                          sys.executable,
                          '-m','mcp_rules_assistant.cli','coverage-near','--within','3','--top','10'
                      ],
                      check=False,
                  )
              except Exception:
                  pass
              sys.exit(1)
          print('[mcp] Coverage policy gate passed.')
          PY
      - name: Forbid skip/xfail markers (non-tests)
        run: |
          if grep -R -n --include='*.py' -E "(^|[^"'])pytest\.mark\.(skip|xfail)" mcp_rules_assistant >/dev/null; then echo "Found actual skip/xfail usage in package code. Disallowed."; exit 1; fi
      - name: Coverage Near Summary
        run: |
          python -m mcp_rules_assistant.cli coverage-near --within 3 --top 10 > near.txt || true
          python -m mcp_rules_assistant.cli coverage-near --within 3 --top 10 --format csv --output near.csv || true
          python -m mcp_rules_assistant.cli coverage-near --within 3 --top 10 --format json --output near.json || true
          tar czf tests-artifacts.tar.gz coverage.xml pytest-junit.xml near.txt near.csv near.json || true
      - name: Coverage Export (CSV/JSON)
        run: |
          python -m mcp_rules_assistant.cli coverage-export --out-dir .mcp/dashboard --weak-top 50 --near-top 50 --within 3 || true
      - name: JB Verify Summary (optional)
        run: |
          bash scripts/jb-ui-verify.sh || true
          if [ -f .mcp/dashboard/jb_verify.json ]; then echo "[jb] summary"; head -n 80 .mcp/dashboard/jb_verify.json; fi
      - name: Coverage Groups Table (Top 5)
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('.mcp/dashboard/groups.csv')
          if not p.exists():
              print('[groups] missing .mcp/dashboard/groups.csv')
          else:
              rows=list(csv.DictReader(p.open('r',encoding='utf-8')))
              rows.sort(key=lambda r: int(r.get('weak_count',0)), reverse=True)
              print('[groups] Top 5 by weak_count:')
              print('| prefix | coverage | threshold | weak/files |')
              print('|---|---:|---:|---:|')
              for r in rows[:5]:
                  cov=float(r.get('coverage',0))*100
                  thr=int(float(r.get('threshold',0))*100)
                  print(f"| {r.get('prefix','')} | {cov:.1f}% | {thr}% | {r.get('weak_count','0')}/{r.get('files_count','0')} |")
          PY
      - name: Upload Coverage Export artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-export
          path: |
            .mcp/dashboard/coverage_summary.json
            .mcp/dashboard/weak_top.csv
            .mcp/dashboard/near_top.csv
            .mcp/dashboard/groups.csv
            .mcp/dashboard/jb_verify.json
            .mcp/dashboard/jb_groups.md
          if-no-files-found: ignore
      - name: Upload JB Verify artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jb-verify
          path: .mcp/dashboard/jb_verify.json
          if-no-files-found: ignore
      - name: Skip/XFail Summary (non-blocking)
        run: |
          python3 scripts/pytest-skipxfail-summary.py pytest-junit.xml || true
      - name: Release Harden Verify (summary)
        run: |
          sh scripts/release-harden-verify.sh || true
      - name: Upload release verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check
          path: .mcp/dashboard/release_check.md
      - name: Upload coverage & JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest-junit.xml
            near.txt
            near.csv
            near.json
            tests-artifacts.tar.gz
      - name: Security (bandit — high only)
        run: |
          bandit -q -lll -x tests -r .
      - name: SAST (semgrep)
        run: |
          # 固定 semgrep 版本以提升可重复性
          python -m pip install 'semgrep==1.91.0'
          semgrep --error --config auto
      - name: Mutation testing
        run: |
          python -m pip install mutmut
          if grep -Eq '(^|[^#])\bmode:\s*strict\b' .mcp/assistant.yaml || grep -Eq '(^|[^#])\bmutation_gate_strict:\s*true\b' .mcp/assistant.yaml; then\n            mutmut run -q\n          else\n            mutmut run -q || true\n          fi

  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Prepare env (mcp_rules_assistant env.prepare)
        run: |
          python - <<'PY'
          from mcp_rules_assistant.mcp_server import JsonRpcServer
          srv = JsonRpcServer()
          out = srv._call_tool("env.prepare", {"create": True, "install": True})
          print(out)
          PY
      - name: Tests in env (pytest + coverage)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          . ./.mcp/venv/bin/activate
          pytest -q -p pytest_cov --maxfail=1 --disable-warnings -W error --strict-markers --cov=mcp_rules_assistant --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=pytest-junit.xml
      - name: Upload artifacts (env tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-prepare
          path: |
            coverage.xml
            pytest-junit.xml
  vscode:
    runs-on: ubuntu-latest
    env:
      VSCODE_LCOV_WINDOW_PCT: '5'
      VSCODE_LCOV_TOP_N: '20'
      # VS Code 前端覆盖率策略（阶段性）：
      # - 仅告警（非阻断）阈值 90%
      # - 硬门禁默认关闭，可在需要时通过将该变量置为 1 开启
      VSCODE_COVERAGE_THRESHOLD_WARN: '90'
      VSCODE_COVERAGE_GATE: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'extensions/vscode/package-lock.json'
      - name: Install and compile
        working-directory: extensions/vscode
        run: |
          npm ci || npm install
          npm run compile
      - name: VS Code extension tests (retry once, non-blocking)
        working-directory: extensions/vscode
        run: |
          set +e
          MCP_VSCODE_TEST_ARGS="" xvfb-run -a npm test 2>&1 | tee vscode-test.log
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            echo "[vscode] first run failed (code=$CODE); retrying once..."
            MCP_VSCODE_TEST_ARGS="" xvfb-run -a npm test 2>&1 | tee -a vscode-test.log || true
          fi
          exit 0
      - name: IDE Compatibility Summary (best-effort)
        run: |
          sh scripts/ide-compat-check.sh || true
          if [ -f extensions/compat_report.json ]; then echo "[ide-compat] found"; else echo "[ide-compat] missing (ok)"; fi
      - name: VS Code coverage warn (min ${VSCODE_COVERAGE_THRESHOLD_WARN}% )
        run: |
          sh scripts/check-lcov.sh extensions/vscode/coverage/lcov.info ${VSCODE_COVERAGE_THRESHOLD_WARN} || true
      - name: VS Code coverage gate (optional)
        if: env.VSCODE_COVERAGE_GATE == '1'
        run: |
          if sh scripts/check-lcov.sh extensions/vscode/coverage/lcov.info ${VSCODE_COVERAGE_THRESHOLD_WARN} gate; then
            echo "[vscode] lcov gate passed"
          else
            echo "[vscode] lcov gate failed; listing near/worst files"
            sh scripts/lcov-near.sh extensions/vscode/coverage/lcov.info ${VSCODE_COVERAGE_THRESHOLD_WARN} ${VSCODE_LCOV_WINDOW_PCT:-5} ${VSCODE_LCOV_TOP_N:-20} > near_vscode.txt || true
            cat near_vscode.txt || true
            exit 1
          fi
      - name: Upload VS Code coverage to Codecov (conditional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${ secrets.CODECOV_TOKEN }
          files: extensions/vscode/coverage/lcov.info
          flags: vscode
          fail_ci_if_error: false
      - name: Upload VS Code lcov artifact (for browsing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-lcov
          path: extensions/vscode/coverage/lcov.info
      - name: Upload IDE compat report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ide-compat
          path: extensions/compat_report.json
      - name: Upload VS Code test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-tests
          path: |
            extensions/vscode/vscode-test.log
            near_vscode.txt

  jetbrains-storyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Generate JetBrains storyboard artifacts
        run: |
          bash scripts/jb-storyboard.sh || true
      - name: JetBrains smoke (status.json)
        run: |
          # 生成并校验状态快照（供 JetBrains 工具窗口使用的同源数据）
          python -m mcp_rules_assistant.cli status-update > .mcp/dashboard/status.json
          python - <<'PY'
          import json,sys
          d=json.load(open('.mcp/dashboard/status.json',encoding='utf-8'))
          has_plan=isinstance(d.get('plan'), dict)
          has_cov=isinstance(d.get('coverage'), dict)
          tests=d.get('tests') or {}
          # 仅校验字段存在性与基本类型，不硬性要求 tests.ok=true（避免偶发不稳定）
          assert has_plan and has_cov, 'missing plan/coverage in status.json'
          assert 'ok' in tests, 'tests field missing ok'
          print('[jb-smoke] status.json structure OK')
          PY
      - name: Upload storyboard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-storyboard
          path: |
            extensions/jetbrains/screenshots/jb_coverage_report.json
            extensions/jetbrains/screenshots/jb_plan.md
            extensions/jetbrains/screenshots/jb_memory.json
            extensions/jetbrains/screenshots/jb_fs_apply_patch_dry.json
            .mcp/dashboard/status.json

  jetbrains-ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: UI smoke (timeboxed)
        run: |
          bash scripts/jb-ui-smoke.sh
      - name: Upload UI smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-ui-smoke-log
          path: extensions/jetbrains/ui_smoke.log

  jetbrains-tests:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.5.0-jdk17
    steps:
      - uses: actions/checkout@v4
      - name: Run JetBrains plugin tests (smoke)
        working-directory: extensions/jetbrains
        env:
          CI: "1"
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx768m'
        run: |
          gradle test -i
      - name: Upload JB test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-tests
          path: |
            extensions/jetbrains/build/test-results
            extensions/jetbrains/build/reports/tests

  jetbrains-package:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.5.0-jdk17
    steps:
      - uses: actions/checkout@v4
      - name: Build JetBrains plugin distribution
        working-directory: extensions/jetbrains
        env:
          CI: "1"
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx768m'
        run: |
          gradle buildPlugin -i
      - name: Upload JB distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-distributions
          path: extensions/jetbrains/build/distributions/*.zip

  python-dist:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Build wheel/sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Twine check
        run: |
          python -m twine check dist/*
      - name: Upload Python dists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
