name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${ matrix.python-version }
          cache: 'pip'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy bandit pytest pytest-cov types-PyYAML
      - name: Pre-commit (all files)
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files || true
      - name: Check Dockerfile existence
        run: |
          test -f Dockerfile || (echo 'Dockerfile missing' && exit 1)
      - name: Dockerfile Lint (hadolint)
        run: |
          test -f Dockerfile && docker run --rm -v "$PWD":/work -w /work hadolint/hadolint:latest hadolint  Dockerfile || echo 'skip hadolint'
      - name: Lint (ruff/black/isort)
        run: |
          ruff check --output-format=github mcp_rules_assistant
          black --check mcp_rules_assistant
          isort --check-only mcp_rules_assistant
      - name: Docs Snapshot Gate (preflight subset)
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q tests/docs/test_docs_anchors.py
      - name: Preflight
        run: |
          sh scripts/preflight.sh
      - name: Type Check (core, blocking)
        run: |
          mypy             mcp_rules_assistant/config.py             mcp_rules_assistant/progress.py             mcp_rules_assistant/tools.py             mcp_rules_assistant/memory.py             mcp_rules_assistant/mcp_server.py             mcp_rules_assistant/cli.py             mcp_rules_assistant/server.py
      - name: Type Check (rest, non-blocking)
        run: |
          mypy mcp_rules_assistant || true
      - name: Tests + Coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -q -p pytest_cov --maxfail=1 --disable-warnings -W error --strict-markers --cov=mcp_rules_assistant --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=96 --junitxml=pytest-junit.xml
      - name: Coverage Policy Gate (core≥98%, others≥95%)
        run: |
          python -m mcp_rules_assistant.cli coverage-report --json > cov.json
          python - <<'PY'
          import json, sys
          data = json.load(open('cov.json'))
          weak = data.get('weak') or []
          if weak:
              print('[mcp] Coverage policy gate failed. Weak files:')
              for w in weak:
                  print(' -', w.get('file'), 'cov=', w.get('coverage'), '<', w.get('threshold'))
              sys.exit(1)
          print('[mcp] Coverage policy gate passed.')
          PY
      - name: Forbid skip/xfail markers (non-tests)
        run: |
          if grep -R -n --include='*.py' -E "(^|[^"'])pytest\.mark\.(skip|xfail)" mcp_rules_assistant >/dev/null; then echo "Found actual skip/xfail usage in package code. Disallowed."; exit 1; fi
      - name: Coverage Near Summary
        run: |
          python -m mcp_rules_assistant.cli coverage-near --within 3 --top 10 > near.txt || true
          python -m mcp_rules_assistant.cli coverage-near --within 3 --top 10 --format csv --output near.csv || true
          python -m mcp_rules_assistant.cli coverage-near --within 3 --top 10 --format json --output near.json || true
          tar czf tests-artifacts.tar.gz coverage.xml pytest-junit.xml near.txt near.csv near.json || true
      - name: Upload coverage & JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest-junit.xml
            near.txt
            near.csv
            near.json
            tests-artifacts.tar.gz
      - name: Security (bandit — high only)
        run: |
          bandit -q -lll -x tests -r .
      - name: Security Report (bandit JSON)
        if: always()
        run: |
          python -m bandit -r mcp_rules_assistant -x tests -f json -o bandit.json || true
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-${{ matrix.python-version }}
          path: bandit.json
      - name: Fetch previous Bandit artifact (best-effort)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = (context.ref || '').replace('refs/heads/','');
            // Find last successful run of this workflow on same branch
            const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ci.yml', branch, status: 'success', per_page: 10 });
            let artifact = null;
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const arts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id });
              const match = arts.data.artifacts.find(a => a.name && a.name.startsWith('bandit-report-'));
              if (match) { artifact = match; break; }
            }
            if (artifact) {
              const dl = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id: artifact.id, archive_format: 'zip' });
              const fs = require('fs');
              fs.writeFileSync('bandit_prev.zip', Buffer.from(dl.data));
              core.info('Downloaded previous Bandit artifact: ' + artifact.name);
            } else {
              core.info('No previous Bandit artifact found');
            }
      - name: Extract previous Bandit artifact
        if: always()
        run: |
          python - <<'PY'
          import zipfile, os
          z = 'bandit_prev.zip'
          if os.path.exists(z):
              with zipfile.ZipFile(z, 'r') as f:
                  f.extractall('bandit_prev')
                  # find first json file
                  for n in f.namelist():
                      if n.endswith('.json'):
                          try:
                              os.replace(os.path.join('bandit_prev', n), 'bandit_prev.json')
                              break
                          except Exception:
                              pass
          PY
      - name: Compare Bandit Trend (warn only)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          def totals(path):
              try:
                  data = json.load(open(path))
                  return data.get('metrics',{}).get('_totals',{})
              except Exception:
                  return {}
          cur = totals('bandit.json')
          prev = totals('bandit_prev.json')
          def val(d,k):
              v = d.get(k,0)
              try: return int(v)
              except Exception: return 0
          keys = ['SEVERITY.HIGH','SEVERITY.MEDIUM','SEVERITY.LOW']
          print('[bandit] current totals:', {k: val(cur,k) for k in keys})
          if prev:
              print('[bandit] previous totals:', {k: val(prev,k) for k in keys})
              delta = {k: val(cur,k) - val(prev,k) for k in keys}
              print('[bandit] delta (current-prev):', delta)
              # per-test-id delta (top increases)
              try:
                  cur_res = (json.load(open('bandit.json')).get('results') or [])
                  prev_res = (json.load(open('bandit_prev.json')).get('results') or [])
                  def count_ids(results):
                      c = Counter()
                      for r in results:
                          tid = r.get('test_id')
                          if tid:
                              c[tid] += 1
                      return c
                  dc = count_ids(cur_res) - count_ids(prev_res)
                  inc = {k:v for k,v in dc.items() if v>0}
                  if inc:
                      top = sorted(inc.items(), key=lambda x: -x[1])[:10]
                      print('[bandit] per-test increases (top):', top)
                  # per-file-path delta (top increases)
                  def count_files(results):
                      c = Counter()
                      for r in results:
                          fn = r.get('filename')
                          if fn:
                              c[fn] += 1
                      return c
                  df = count_files(cur_res) - count_files(prev_res)
                  incf = {k:v for k,v in df.items() if v>0}
                  if incf:
                      topf = sorted(incf.items(), key=lambda x: -x[1])[:10]
                      print('[bandit] per-file increases (top):', topf)
                  # GitHub Annotations (warn-only) for interesting issues
                  interesting = set(os.environ.get('BANDIT_ANNOTATE_TEST_IDS','B101,B404,B603,B110,B112').split(','))
                  for r in cur_res:
                      tid = r.get('test_id')
                      sev = str(r.get('issue_severity','')).upper()
                      if sev == 'HIGH' or tid in interesting:
                          fn = r.get('filename') or ''
                          ln = r.get('line_number') or 1
                          msg = r.get('issue_text') or ''
                          title = f"Bandit {tid} ({sev})"
                          print(f"::warning file={fn},line={ln},title={title}::{msg[:200]}")
              except Exception as e:
                  print('[bandit] per-test delta parse error:', e)
          else:
              print('[bandit] previous totals not found')
          PY
      - name: Bandit Trend Artifact
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          out = open('bandit-trend.txt','w')
          def write(*a):
              try:
                  out.write(' '.join(str(x) for x in a) + '\n')
              except Exception:
                  pass
          def totals(path):
              try:
                  data = json.load(open(path))
                  return data.get('metrics',{}).get('_totals',{})
              except Exception:
                  return {}
          cur = totals('bandit.json')
          prev = totals('bandit_prev.json')
          def val(d,k):
              v = d.get(k,0)
              try: return int(v)
              except Exception: return 0
          keys = ['SEVERITY.HIGH','SEVERITY.MEDIUM','SEVERITY.LOW']
          write('[bandit] current totals:', {k: val(cur,k) for k in keys})
          if prev:
              write('[bandit] previous totals:', {k: val(prev,k) for k in keys})
              delta = {k: val(cur,k) - val(prev,k) for k in keys}
              write('[bandit] delta (current-prev):', delta)
              try:
                  cur_doc = json.load(open('bandit.json'))
                  prev_doc = json.load(open('bandit_prev.json')) if os.path.exists('bandit_prev.json') else {"results": []}
                  cur_res = (cur_doc.get('results') or [])
                  prev_res = (prev_doc.get('results') or [])
                  def count_ids(results):
                      c = Counter()
                      for r in results:
                          tid = r.get('test_id')
                          if tid:
                              c[tid] += 1
                      return c
                  dc = count_ids(cur_res) - count_ids(prev_res)
                  inc = {k:v for k,v in dc.items() if v>0}
                  if inc:
                      top = sorted(inc.items(), key=lambda x: -x[1])[:10]
                      write('[bandit] per-test increases (top):', top)
                  def count_files(results):
                      c = Counter()
                      for r in results:
                          fn = r.get('filename')
                          if fn:
                              c[fn] += 1
                      return c
                  df = count_files(cur_res) - count_files(prev_res)
                  incf = {k:v for k,v in df.items() if v>0}
                  if incf:
                      topf = sorted(incf.items(), key=lambda x: -x[1])[:10]
                      write('[bandit] per-file increases (top):', topf)
              except Exception as e:
                  write('[bandit] trend compose error:', e)
          else:
              write('[bandit] previous totals not found')
          try:
              out.close()
          except Exception:
              pass
          PY
      - name: Upload Bandit trend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-trend-${{ matrix.python-version }}
          path: bandit-trend.txt
      - name: SAST (semgrep)
        run: |
          python -m pip install semgrep
          semgrep --error --config auto
      - name: Mutation testing
        run: |
          python -m pip install mutmut
          mutmut run -q || true

      - name: Agent cmd_errors CSV (best-effort)
        if: always()
        run: |
          python - <<'PY'
          import json, os, csv
          p = '.mcp/dashboard/history.json'
          if os.path.exists(p):
              try:
                  data = json.load(open(p, encoding='utf-8')) or []
                  with open('agent_cmd_errors.csv','w', newline='', encoding='utf-8') as f:
                      w = csv.writer(f)
                      w.writerow(['ts','cmd_errors','overall'])
                      for r in data:
                          w.writerow([r.get('ts'), r.get('cmd_errors',0), r.get('overall',0)])
              except Exception:
                  pass
          PY
      - name: Upload cmd_errors CSV on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cmd-errors-${{ matrix.python-version }}
          path: agent_cmd_errors.csv

  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Prepare env (mcp_rules_assistant env.prepare)
        run: |
          python - <<'PY'
          from mcp_rules_assistant.mcp_server import JsonRpcServer
          srv = JsonRpcServer()
          out = srv._call_tool("env.prepare", {"create": True, "install": True})
          print(out)
          PY
      - name: Tests in env (pytest + coverage)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          . ./.mcp/venv/bin/activate
          pytest -q -p pytest_cov --maxfail=1 --disable-warnings -W error --strict-markers --cov=mcp_rules_assistant --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=pytest-junit.xml
      - name: Upload artifacts (env tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-prepare
          path: |
            coverage.xml
            pytest-junit.xml
  vscode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'extensions/vscode/package-lock.json'
      - name: Install and compile
        working-directory: extensions/vscode
        run: |
          npm ci || npm install
          npm run compile
      - name: VS Code extension tests
        working-directory: extensions/vscode
        run: |
          MCP_VSCODE_TEST_ARGS="" xvfb-run -a npm test 2>&1 | tee vscode-test.log
      - name: VS Code coverage threshold (warn)
        run: |
          sh scripts/check-lcov.sh extensions/vscode/coverage/lcov.info 30
      - name: Upload VS Code coverage to Codecov (conditional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${ secrets.CODECOV_TOKEN }
          files: extensions/vscode/coverage/lcov.info
          flags: vscode
          fail_ci_if_error: false
      - name: Upload VS Code test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-tests
          path: extensions/vscode/vscode-test.log
