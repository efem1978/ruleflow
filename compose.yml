services:
  dev-agent:
    build: .
    working_dir: /work
    volumes:
      - .:/work
    environment:
      - PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/work
      # 自动提交默认禁用（安全）；如需启用置为 1
      - DEV_AGENT_AUTOCOMMIT=0
      - DEV_AGENT_COMMIT_INTERVAL=180
      # 每日里程碑自动 tag 默认禁用（本地，不推送）
      - DEV_AGENT_AUTOTAG=0
      # 失败绕过后允许自动提交开关，默认禁用
      - DEV_AGENT_BYPASS_COMMIT=0
      # 自动推送默认禁用；如需启用置为 1
      - DEV_AGENT_AUTOPUSH=0
    command: python -m mcp_rules_assistant.dev_agent --interval 60

  vscode-test:
    image: node:20-bookworm
    working_dir: /work/extensions/vscode
    volumes:
      - .:/work
      - npm-cache:/root/.npm
    environment:
      - CI=1
      - NO_COLOR=1
      - FORCE_COLOR=0
      - MCP_VSCODE_TEST_ARGS
    command:
      - bash
      - -lc
      - |
        set -e
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y >/dev/null
        apt-get install -y --no-install-recommends \
          xvfb xauth \
          libglib2.0-0 libgdk-pixbuf-2.0-0 \
          libgtk-3-0 libasound2 libnss3 libxss1 libxshmfence1 \
          libgbm1 libdrm2 libxdamage1 libxfixes3 libxcomposite1 \
          libxi6 libxrandr2 libatk-bridge2.0-0 libx11-xcb1 libxext6 \
          libxkbfile1 libxkbcommon0 libwayland-client0 libxrender1 \
          ca-certificates >/dev/null
        npm ci --no-audit --no-fund
        xvfb-run -a -s '-screen 0 1024x768x24' npm test

  jb-build:
    image: gradle:8.7.0-jdk17
    working_dir: /work/extensions/jetbrains
    volumes:
      - .:/work
    command: bash -lc "gradle -v || true"

volumes:
  npm-cache:
