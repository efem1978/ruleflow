performance:
  mode: fast
  on_save:
    format_on_save: true
    lint_changed_only: true
    typecheck_incremental: false
    quick_tests: false
  on_commit:
    lint: true
    typecheck_incremental: true
    test_impacted: true
  on_push:
    test_all: true
    coverage:
      enforce: true
      min_module: 0.96
      min_core: 0.98
    security_scan: true
    mutation_test: false
language: python
bilingual: true
coverage:
  policy:
    config.py: 0.98
    progress.py: 0.98
    tools.py: 0.98
    memory.py: 0.98
    mcp_server.py: 0.98
    cli.py: 0.98
    server.py: 0.98
    dev_agent.py: 0.95
    license_utils.py: 0.95
  near:
    within: 0.008
    top: 50
tests:
  quick_fail_decay:
    high_days: 3
    high_bonus: 2
    mid_days: 7
    mid_bonus: 1
    history_limit: 400
ci:
  hadolint: true
  semgrep_config: p/ci
  vscode_required: true
  hadolint_image: hadolint/hadolint:2.12.0
  hadolint_args: --ignore DL3008
rules:
  conflict_delta:
    __default__: 0.03
    coverage.min_module: 0.02
    coverage.min_core: 0.02
execution:
  allowed_write_prefixes:
  - mcp_rules_assistant/
  - tests/
  - docs/
  - .mcp/
  allowed_write_extensions:
  - .py
  - .md
  - .yaml
  - .yml
  checks_delegate_run_cmd: true
  fs_guard_post_checks: false
  fs_guard_strict: false
license:
  required: false
