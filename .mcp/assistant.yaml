performance:
  mode: fast
  on_save:
    format_on_save: true
    lint_changed_only: true
    typecheck_incremental: false
    quick_tests: false
  on_commit:
    lint: true
    typecheck_incremental: true
    test_impacted: true
  on_push:
    test_all: true
    coverage:
      enforce: true
      min_module: 0.99
      min_core: 1.0
    security_scan: true
    mutation_test: false
language: python
bilingual: true
license:
  required: false
coverage:
  policy:
    mcp_rules_assistant/hooks.py: 0
  near:
    within: 0.03
    top: 50
tests:
  quick_fail_decay:
    high_days: 3
    high_bonus: 2
    mid_days: 7
    mid_bonus: 1
    history_limit: 400
execution:
  fs_guard_post_checks: true
  fs_guard_strict: true
  allowed_write_prefixes: []
  allowed_write_extensions: []
  disallow_patterns: []
ci:
  hadolint: true
  vscode_required: true
  semgrep_config: auto
memory:
  allow_write: true
